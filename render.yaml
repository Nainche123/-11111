services:
  - type: web
    name: vexo-store
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BANK_INFO
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LICENSE_ADMIN_SECRET
        sync: false
